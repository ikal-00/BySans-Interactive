<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship 3D Hero Showcase — Endless Descent</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #02050e;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
      }
      #showcase-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .badge-overlay {
        position: absolute;
        top: 24px;
        left: 24px;
        color: #f8fafc;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 8px;
        padding: 12px 20px;
        backdrop-filter: blur(8px);
      }
      .badge-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #38bdf8;
      }
      .badge-desc {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="badge-overlay">
      <div class="badge-title">Hero Starfighter 3D Asset</div>
      <div class="badge-desc">Faceted Diamond Visor • Satin Ceramic Armor • Twin Jet Nacelles</div>
    </div>
    <canvas id="showcase-canvas"></canvas>
    <script type="module" src="/src/showcase.ts"></script>
  </body>
</html>
